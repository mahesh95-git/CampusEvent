
name: Campus Event CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: campus-event-production
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: az account show --output table

      - name: Login to Azure Container Registry
        run: az acr login --name maheshrathod

      - name: Build and push frontend image
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:${GITHUB_SHA}" \
            -t "${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:latest" \
            ./client

          docker push "${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:${GITHUB_SHA}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:latest"

      - name: Build and push backend image
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:${GITHUB_SHA}" \
            -t "${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:latest" \
            ./server

          docker push "${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:${GITHUB_SHA}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:latest"

     
      - name: Diagnose Azure VM Run Command
        run: |
          echo "Checking Azure VM..."

          az vm show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --query "{name:name, provisioningState:provisioningState, location:location}" \
            --output json

          echo "Checking VM status..."

          az vm get-instance-view \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --query "instanceView.statuses[].displayStatus" \
            --output json

          echo "Testing Azure Run Command..."

          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "echo RUN_COMMAND_OK" \
            --output json

