name: Campuse event CI

on:
    push:
    pull_request:
    workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
    docker-build:
        runs-on: ubuntu-latest
        name: Build Docker image
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Azure Login using OIDC
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Verify Azure identity
              run: |
                az account show \
                  --query "{subscription:id, tenant:tenantId, user:user.name, userType:user.type}" \
                  --output json
            - name: Login to Azure Container Registry
              run: az acr login --name maheshrathod
            - name: Build frontend image
              run: |
               docker build \
                -t ${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:${{ github.sha }} \
                -t ${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:latest \
                ./client
            - name: Build backend image
              run: |
               docker build \
               -t ${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:${{ github.sha }} \
               -t ${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:latest \
               ./server
            - name: Push frontend image
              run: |
                docker push ${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:${{ github.sha }}
                docker push ${{ vars.ACR_LOGIN_SERVER }}/campus-event-frontend:latest

            - name: Push backend image
              run: |
                docker push ${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:${{ github.sha }}
                docker push ${{ vars.ACR_LOGIN_SERVER }}/campus-event-server:latest

